<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 294" role="img" aria-labelledby="title desc">
<title id="title">AgentGate release decision workflow</title>
<desc id="desc">A trusted baseline and candidate configuration are evaluated against adversarial tests, deterministic checks and statistical analysis, producing a release decision and signed evidence.</desc>
<rect width="1200" height="294" fill="#253A32"/>
