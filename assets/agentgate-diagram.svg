<text x="35" y="41" font-family="monospace" font-size="17" letter-spacing="2">AGENTGATE / RELEASE EVALUATION</text>
<g font-size="20" font-weight="bold">
<text x="36" y="104">BASELINE</text><text x="36" y="200">CANDIDATE</text>
<text x="361" y="141">ATTACK</text><text x="361" y="168">SUITE</text>
<text x="606" y="141">BREACH</text><text x="606" y="168">CHECKS</text>
<text x="838" y="141">STATISTICAL</text><text x="838" y="168">GATE</text>
<text x="1062" y="141" font-size="17">VERDICT</text>
</g>
